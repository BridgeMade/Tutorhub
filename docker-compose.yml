# ===========================================
# DOCKER COMPOSE FOR TUTORHUB DEVELOPMENT
# ===========================================

version: '3.8'

services:
  # ===========================================
  # MAIN APPLICATION
  # ===========================================
  tutorhub:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        - REACT_APP_ENVIRONMENT=development
        - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
        - REACT_APP_EMAIL_API_KEY=${REACT_APP_EMAIL_API_KEY}
    container_name: tutorhub-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
      - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
      - REACT_APP_EMAIL_API_KEY=${REACT_APP_EMAIL_API_KEY}
    networks:
      - tutorhub-network
    depends_on:
      - redis
      - nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # PRODUCTION BUILD (for testing)
  # ===========================================
  tutorhub-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - REACT_APP_ENVIRONMENT=production
        - REACT_APP_SUPABASE_URL=${REACT_APP_SUPABASE_URL}
        - REACT_APP_SUPABASE_ANON_KEY=${REACT_APP_SUPABASE_ANON_KEY}
        - REACT_APP_EMAIL_API_KEY=${REACT_APP_EMAIL_API_KEY}
        - GENERATE_SOURCEMAP=false
    container_name: tutorhub-production
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - tutorhub-network
    profiles:
      - production
    healthcheck:
      test: ["/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # REDIS (for caching and sessions)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: tutorhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - tutorhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # NGINX (reverse proxy and load balancer)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: tutorhub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - tutorhub-network
    depends_on:
      - tutorhub
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # MONITORING AND OBSERVABILITY
  # ===========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: tutorhub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - tutorhub-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: tutorhub-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - tutorhub-network
    profiles:
      - monitoring

  # ===========================================
  # TESTING SERVICES
  # ===========================================
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tutorhub-tests
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
      - CI=true
    command: npm run test:all
    networks:
      - tutorhub-network
    profiles:
      - testing

  lighthouse:
    image: femtopixel/google-lighthouse
    container_name: tutorhub-lighthouse
    volumes:
      - ./lighthouse-reports:/home/chrome/reports
    command: lighthouse --chrome-flags="--headless --no-sandbox --disable-gpu" --output html --output-path /home/chrome/reports/report.html http://tutorhub:3000
    networks:
      - tutorhub-network
    depends_on:
      - tutorhub
    profiles:
      - testing

  # ===========================================
  # BACKUP SERVICE
  # ===========================================
  backup:
    image: alpine:latest
    container_name: tutorhub-backup
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    environment:
      - BACKUP_SCHEDULE=0 2 * * *  # Daily at 2 AM
    command: sh -c "chmod +x /backup.sh && crond -f"
    networks:
      - tutorhub-network
    profiles:
      - production

# ===========================================
# NETWORKS
# ===========================================
networks:
  tutorhub-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===========================================
# VOLUMES
# ===========================================
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local